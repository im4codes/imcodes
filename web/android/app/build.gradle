apply plugin: 'com.android.application'

def keystoreFilePath = System.getenv('KEYSTORE_FILE')
def keystorePass = System.getenv('KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('KEY_ALIAS')
def releaseKeyPassword = System.getenv('KEY_PASSWORD')
def releaseSigningAvailable = keystoreFilePath && keystorePass && releaseKeyAlias && releaseKeyPassword && file(keystoreFilePath).exists()

if (!releaseSigningAvailable) {
    logger.lifecycle("Release signing configuration not found. assembleRelease will build without a production signing key until KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD are provided.")
}

// Single source of truth for both flavors. Keep the resolved package name
// outside the flavor blocks so AGP can use it during manifest merging.
def appPackageName = "com.im.codes"

android {
    namespace = appPackageName
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(keystoreFilePath)
                storePassword keystorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId appPackageName
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        def abiFiltersProp = findProperty('androidAbiFilters')?.toString()?.trim()
        def resolvedAbiFilters = abiFiltersProp
            ? abiFiltersProp.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
            : ['arm64-v8a']
        if (resolvedAbiFilters.isEmpty()) {
            resolvedAbiFilters = ['arm64-v8a']
        }
        ndk {
            abiFilters(*resolvedAbiFilters)
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Two independent distributions with the same applicationId. The
    // withoutFcm variant deliberately contains no push SDK or push manifest.
    flavorDimensions += "push"
    productFlavors {
        withFcm {
            dimension "push"
            buildConfigField "String", "PUSH_REGION", "\"global\""
            buildConfigField "boolean", "HAS_FCM", "true"
        }
        withoutFcm {
            dimension "push"
            buildConfigField "String", "PUSH_REGION", "\"none\""
            buildConfigField "boolean", "HAS_FCM", "false"
            proguardFile 'proguard-without-fcm.pro'
        }
    }

    // Model weights are deflated in the APK and extracted into noBackupFilesDir on startup.
    // Compress native libs in the APK so PackageManager extracts arm64-v8a at install time.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.browser:browser:1.8.0"


}

apply from: 'capacitor.build.gradle'

// capacitor.build.gradle is generated by `cap sync` and currently declares
// the push plugin as a shared implementation dependency. Move that one
// dependency to the FCM flavor after the generated file is applied, so a
// withoutFcm runtime classpath cannot resolve the Capacitor push module (or
// its Firebase/GMS transitives).
configurations.implementation.dependencies.removeAll { dependency ->
    dependency.name == 'capacitor-push-notifications'
}
dependencies {
    withFcmImplementation project(':capacitor-push-notifications')
}

// Some non-push Capacitor plugins (notably the updater) expose optional Play
// Services transitives. The pure package must not carry any GMS/Firebase or
// vendor-push artifact, regardless of which optional plugin requested it.
configurations.matching { configuration ->
    configuration.name.toLowerCase().startsWith('withoutfcm')
}.configureEach { configuration ->
    exclude group: 'com.google.android.gms'
    exclude group: 'com.google.firebase'
    exclude group: 'cn.jiguang.sdk'
}

preBuild.dependsOn ':imcodes-streaming-speech:prepareStreamingSpeech'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // The plugin creates one task per variant. Never let a present
        // google-services.json generate Firebase resources for the pure build.
        tasks.matching { task ->
            task.name.toLowerCase().contains('withoutfcm')
                && task.name.toLowerCase().contains('googleservices')
        }.configureEach { task ->
            task.enabled = false
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied")
}
