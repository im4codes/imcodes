name: build-pc-app

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: PC App V1 release version
        required: true
        type: string
  push:
    tags:
      - 'pc-app-v*'

permissions:
  contents: read

env:
  NODE_VERSION_PRIMARY: '24'

jobs:
  build-macos:
    name: PC App macOS (.dmg)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_PRIMARY }}
      - name: Install root and pc-app dependencies
        run: |
          set -euo pipefail
          npm ci
          npm --prefix apps/pc-app ci
      - name: Verify node-exe has no native deps
        run: npm run check:node-exe-deps
      - name: Resolve PC App release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.build_version }}"
          else
            VERSION="${GITHUB_REF_NAME#pc-app-v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid PC App build version: $VERSION" >&2
            exit 1
          fi
          echo "IMCODES_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Import macOS release-signing identity
        env:
          IMCODES_MACOS_SIGNING_P12_BASE64: ${{ secrets.IMCODES_MACOS_SIGNING_P12_BASE64 }}
          IMCODES_MACOS_SIGNING_P12_PASSWORD: ${{ secrets.IMCODES_MACOS_SIGNING_P12_PASSWORD }}
          IMCODES_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.IMCODES_MACOS_KEYCHAIN_PASSWORD }}
          IMCODES_MACOS_TEAM_ID: ${{ secrets.IMCODES_MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          IDENTITY="$(node scripts/macos-release-signing.mjs import)"
          echo "IMCODES_MACOS_SIGNING_IDENTITY=$(printf '%s' "$IDENTITY" | node -e 'process.stdin.on("data",(d)=>process.stdout.write(JSON.parse(d).sha1))')" >> "$GITHUB_ENV"
      - name: Write macOS notary API key
        env:
          IMCODES_MACOS_NOTARY_KEY_BASE64: ${{ secrets.IMCODES_MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IMCODES_MACOS_NOTARY_KEY_BASE64:-}" ]; then
            echo 'macOS notary API key is required.' >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/imcodes-macos-notary.p8"
          printf '%s' "$IMCODES_MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "IMCODES_MACOS_NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build and verify universal bundled tmux
        run: node scripts/build-macos-bundled-tmux.mjs --out-dir dist-node-exe/bundled-tmux-macos
      - name: Build, sign, notarize (.app), verify, and package macOS .dmg
        env:
          IMCODES_MACOS_NOTARY_KEY_ID: ${{ secrets.IMCODES_MACOS_NOTARY_KEY_ID }}
          IMCODES_MACOS_NOTARY_ISSUER: ${{ secrets.IMCODES_MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          node scripts/build-pc-app.mjs \
            --platform darwin \
            --arch universal \
            --version "$IMCODES_BUILD_VERSION" \
            --tmux-dir dist-node-exe/bundled-tmux-macos \
            --require-sign \
            --require-notarize
      - name: Upload macOS PC App .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: imcodes-pc-app-macos
          path: |
            apps/pc-app/release/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Remove macOS release-signing material
        if: always()
        run: node scripts/macos-release-signing.mjs cleanup

  build-windows:
    name: PC App Windows (.exe)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_PRIMARY }}
      - name: Install root and pc-app dependencies
        run: |
          npm ci
          npm --prefix apps/pc-app ci
      - name: Verify node-exe has no native deps
        run: npm run check:node-exe-deps
      - name: Resolve PC App release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.build_version }}"
          else
            VERSION="${GITHUB_REF_NAME#pc-app-v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid PC App build version: $VERSION" >&2
            exit 1
          fi
          echo "IMCODES_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Import Windows release-signing certificate
        shell: powershell
        env:
          IMCODES_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.IMCODES_WINDOWS_SIGNING_PFX_BASE64 }}
          IMCODES_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.IMCODES_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IMCODES_WINDOWS_SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:IMCODES_WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'Windows release-signing secrets are required.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'imcodes-windows-release-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:IMCODES_WINDOWS_SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:IMCODES_WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate -or -not $certificate.HasPrivateKey) { throw 'Imported signing certificate has no private key.' }
          Remove-Item -LiteralPath $pfxPath -Force
          $publicCertificatePath = Join-Path $env:RUNNER_TEMP 'imcodes-windows-release-signing.cer'
          Export-Certificate -Cert $certificate -FilePath $publicCertificatePath -Force | Out-Null
          Import-Certificate -FilePath $publicCertificatePath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Import-Certificate -FilePath $publicCertificatePath -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          "IMCODES_WINDOWS_SIGNING_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try { $signerSha256 = [BitConverter]::ToString($sha256.ComputeHash($certificate.RawData)).Replace('-', '').ToLowerInvariant() } finally { $sha256.Dispose() }
          "IMCODES_WINDOWS_SIGNING_CERT_SHA256=$signerSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, sign, and verify Windows PC App .exe
        run: node scripts/build-pc-app.mjs --platform win32 --arch x64 --require-sign
      - name: Upload Windows PC App .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: imcodes-pc-app-windows
          path: |
            apps/pc-app/release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Remove Windows release-signing material
        if: always()
        shell: powershell
        run: |
          $certificatePaths = @()
          if ($env:IMCODES_WINDOWS_SIGNING_CERT_THUMBPRINT) {
            $certificatePaths = @(
              "Cert:\CurrentUser\My\$env:IMCODES_WINDOWS_SIGNING_CERT_THUMBPRINT",
              "Cert:\LocalMachine\TrustedPeople\$env:IMCODES_WINDOWS_SIGNING_CERT_THUMBPRINT",
              "Cert:\LocalMachine\TrustedPublisher\$env:IMCODES_WINDOWS_SIGNING_CERT_THUMBPRINT"
            )
            $certificatePaths | ForEach-Object { Remove-Item -LiteralPath $_ -Force -ErrorAction SilentlyContinue }
          }
          $materialPaths = @(
            (Join-Path $env:RUNNER_TEMP 'imcodes-windows-release-signing.pfx'),
            (Join-Path $env:RUNNER_TEMP 'imcodes-windows-release-signing.cer')
          )
          $materialPaths | ForEach-Object { Remove-Item -LiteralPath $_ -Force -ErrorAction SilentlyContinue }
          $leftovers = @(($certificatePaths + $materialPaths) | Where-Object { Test-Path -LiteralPath $_ })
          if ($leftovers.Count -gt 0) { throw 'Windows release-signing material cleanup was incomplete.' }
